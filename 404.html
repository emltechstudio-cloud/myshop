<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Page Not Found — MyShop</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0f172a;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px;}
        .wrap{max-width:400px;}
        .icon{font-size:4rem;margin-bottom:16px;}
        h1{font-size:2rem;font-weight:800;margin-bottom:8px;}
        p{color:#64748b;margin-bottom:24px;line-height:1.6;}
        a{display:inline-block;background:#1e40af;color:white;text-decoration:none;padding:12px 28px;border-radius:50px;font-weight:600;transition:all .2s;}
        a:hover{background:#1e3a8a;transform:translateY(-2px);}
        .watermark{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-size:.75rem;color:#94a3b8;}
    </style>
</head>
<body>
    <div class="wrap">
        <div class="icon">🔍</div>
        <h1>Page Not Found</h1>
        <p>This hub doesn't exist yet, or the link may have changed.</p>
        <a href="/">Back to MyShop</a>
    </div>
    <div class="watermark">Powered by MyShop — EML Tech Studio</div>
</body>
</html>
