<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1e40af">
    <title>MyShop Hub</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ===== original styles (keep everything) ===== */
        *{margin:0;padding:0;box-sizing:border-box;}
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --text2: #475569;
            --text3: #94a3b8;
            --border: #e2e8f0;
            --brand: #1e40af;
            --brand-light: #3b82f6;
            --brand-dark: #1e3a8a;
            --success: #10b981;
            --whatsapp: #25d366;
            --telegram: #26a5e4;
            --signal: #3b76f0;
            --messenger: #0084ff;
            --viber: #7360f2;
            --line: #00c300;
            --wechat: #2b9c2b;
            --radius: 20px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.06);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.1);
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        html{scroll-behavior:smooth;}
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid transparent;
            transition: all var(--transition);
        }
        .navbar.scrolled {
            border-bottom-color: var(--border);
            box-shadow: var(--shadow-md);
        }
        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .nav-brand img { width: 34px; height: 34px; border-radius: 8px; }
        .nav-brand span {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--brand);
            letter-spacing: -0.5px;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
        }
        .nav-links a {
            color: var(--text2);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.88rem;
            transition: color 0.2s;
            position: relative;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--brand);
            border-radius: 2px;
            transition: width 0.25s;
        }
        .nav-links a:hover { color: var(--brand); }
        .nav-links a:hover::after { width: 100%; }
        .nav-cta {
            background: var(--brand);
            color: white !important;
            padding: 10px 22px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all var(--transition);
            box-shadow: 0 4px 14px rgba(30,64,175,0.2);
        }
        .nav-cta:hover {
            background: var(--brand-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(30,64,175,0.3);
        }
        .nav-cta::after { display: none !important; }
        .nav-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.4rem;
            color: var(--text);
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
        }
        .nav-toggle:active { background: var(--border); }
        @media (max-width: 640px) { .nav-links { display: none; } .nav-toggle { display: block; } }
        .hero {
            position: relative;
            padding: 130px 24px 70px;
            text-align: center;
            background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -40%; left: -30%;
            width: 160%; height: 180%;
            background: radial-gradient(ellipse at 30% 40%, rgba(30,64,175,0.05) 0%, transparent 55%),
                        radial-gradient(ellipse at 70% 20%, rgba(59,130,246,0.04) 0%, transparent 55%);
            pointer-events: none;
        }
        .hero > * { position: relative; z-index: 1; }
        .hero-logo {
            width: 120px;
            height: 120px;
            border-radius: 28px;
            object-fit: cover;
            margin: 0 auto 20px;
            border: 4px solid white;
            box-shadow: 0 8px 36px rgba(0,0,0,0.1);
            background: white;
            transition: transform var(--transition);
        }
        .hero-logo:hover { transform: scale(1.04); }
        .hero-name {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: -1.5px;
            margin-bottom: 8px;
            color: var(--text);
        }
        .hero-tagline {
            font-size: 1.15rem;
            color: var(--text2);
            font-weight: 500;
            max-width: 520px;
            margin: 0 auto 24px;
        }
        .hero-meta {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            color: var(--text3);
            font-size: 0.9rem;
        }
        .hero-meta span { display: flex; align-items: center; gap: 7px; }
        .pulse-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.5); }
        }
        .quick-actions {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            padding: 0 24px 40px;
            max-width: 700px;
            margin: 0 auto;
        }
        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all var(--transition);
            white-space: nowrap;
        }
        .action-btn.primary {
            background: var(--brand);
            color: white;
            box-shadow: 0 8px 24px rgba(30,64,175,0.25);
        }
        .action-btn.primary:hover {
            background: var(--brand-dark);
            transform: translateY(-3px);
        }
        .action-btn.whatsapp {
            background: var(--whatsapp);
            color: white;
            box-shadow: 0 8px 24px rgba(37,211,102,0.25);
        }
        .action-btn.whatsapp:hover {
            transform: translateY(-3px);
        }
        .action-btn.ghost {
            background: white;
            color: var(--text);
            border: 2px solid var(--border);
        }
        .action-btn.ghost:hover {
            border-color: var(--brand);
            color: var(--brand);
        }
        .section {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 24px;
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .section-title i { color: var(--brand); font-size: 1.3rem; }
        .section-title .line {
            flex: 1;
            height: 2px;
            background: var(--border);
            border-radius: 2px;
        }
        .about-card {
            background: var(--card);
            padding: 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }
        .about-text {
            color: var(--text2);
            font-size: 1.05rem;
            line-height: 1.8;
        }
        .catalog-card {
            background: var(--card);
            padding: 40px 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            text-align: center;
        }
        .catalog-card.whatsapp-card {
            background: linear-gradient(135deg, #dcfce7, #d1fae5);
            border-color: #bbf7d0;
        }
        .catalog-card.coming-soon {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border-color: #fcd34d;
        }
        .catalog-icon { font-size: 3.5rem; margin-bottom: 16px; }
        .catalog-card h3 { font-size: 1.3rem; font-weight: 800; margin-bottom: 8px; }
        .catalog-card p { margin-bottom: 20px; font-size: 0.95rem; max-width: 450px; margin-left: auto; margin-right: auto; }
        .whatsapp-card h3 { color: #166534; }
        /* ===== new styles for dynamic socials & messaging ===== */
        .social-scroll {
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            padding: 8px 4px 16px;
            margin: 0 -4px;
            -webkit-overflow-scrolling: touch;
        }
        .social-scroll::-webkit-scrollbar { height: 4px; }
        .social-scroll::-webkit-scrollbar-track { background: var(--border); border-radius: 4px; }
        .social-scroll::-webkit-scrollbar-thumb { background: var(--brand-light); border-radius: 4px; }
        .social-item {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 80px;
            padding: 10px 0;
            margin: 0 8px;
            background: var(--card);
            border-radius: 16px;
            text-decoration: none;
            color: var(--text);
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .social-item i { font-size: 1.8rem; color: var(--brand); }
        .social-item span { font-size: 0.7rem; font-weight: 500; text-align: center; }
        .social-item:hover { transform: translateY(-3px); border-color: var(--brand-light); box-shadow: var(--shadow-md); }
        .social-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        @media (min-width: 769px) {
            .social-scroll { display: none; }
            .social-grid { display: grid; }
        }
        @media (max-width: 768px) {
            .social-grid { display: none; }
            .social-scroll { display: block; }
        }
        .toggle-socials-btn {
            margin-top: 16px;
            background: transparent;
            border: 1px solid var(--border);
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--brand);
            transition: all 0.2s;
        }
        .toggle-socials-btn:hover { background: var(--brand); color: white; }
        .messaging-scroll {
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            padding: 8px 4px 16px;
            -webkit-overflow-scrolling: touch;
        }
        .messaging-item {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 80px;
            padding: 10px 0;
            margin: 0 8px;
            background: var(--card);
            border-radius: 16px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .messaging-item .msg-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: white;
            margin-bottom: 4px;
        }
        .messaging-item.whatsapp .msg-icon { background: var(--whatsapp); }
        .messaging-item.telegram .msg-icon { background: var(--telegram); }
        .messaging-item.signal .msg-icon { background: var(--signal); }
        .messaging-item.messenger .msg-icon { background: var(--messenger); }
        .messaging-item.viber .msg-icon { background: var(--viber); }
        .messaging-item.line .msg-icon { background: var(--line); }
        .messaging-item.wechat .msg-icon { background: var(--wechat); }
        .messaging-item span { font-size: 0.7rem; font-weight: 500; color: var(--text); }
        .messaging-item:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
        /* FAB – single instance, no duplication */
        .fab {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: var(--whatsapp);
            color: white;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 8px 28px rgba(37,211,102,0.35);
            z-index: 999;
            text-decoration: none;
            transition: all var(--transition);
        }
        .fab:hover { transform: scale(1.1); }
        @media (max-width: 768px) { .fab { display: flex; } }
        .site-footer {
            text-align: center;
            padding: 40px 24px;
            color: var(--text3);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }
        .site-footer a { color: var(--brand); text-decoration: none; font-weight: 600; }
        .watermark {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--card);
            padding: 12px 24px;
            border-radius: 50px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            margin-top: 16px;
            transition: box-shadow var(--transition);
        }
        .watermark:hover { box-shadow: var(--shadow-md); }
        .watermark img { width: 24px; height: 24px; border-radius: 6px; }
        .loading-screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border);
            border-top-color: var(--brand);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-state {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .error-card {
            background: var(--card);
            padding: 48px 36px;
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            text-align: center;
            max-width: 440px;
        }
        .error-card .icon { font-size: 4rem; margin-bottom: 16px; }
        .error-card h2 { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; }
        .error-card p { color: var(--text2); margin-bottom: 24px; }
        .error-card a {
            display: inline-block;
            background: var(--brand);
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
        }
        .fade-in {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
        @media (max-width: 640px) {
            .hero { padding: 100px 16px 50px; }
            .hero-name { font-size: 2rem; }
            .hero-logo { width: 90px; height: 90px; }
            .action-btn { padding: 13px 22px; font-size: 0.88rem; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading-screen">
            <div class="spinner"></div>
            <p style="color: var(--text2); font-weight: 500;">Loading your hub...</p>
        </div>
    </div>
    <!-- FAB container – single instance -->
    <div id="fabContainer" style="position:fixed; bottom:28px; right:28px; z-index:999;"></div>

    <script>
        (async function() {
            const API = 'https://emltechstudio-myshop-api.hf.space';

            // ========== HELPER FUNCTIONS (preserve original) ==========
            function fixUrl(url) {
                if (!url) return '#';
                url = url.trim();
                if (url.startsWith('http://') || url.startsWith('https://')) return url;
                return 'https://' + url;
            }

            function isWhatsAppUrl(url) {
                if (!url) return false;
                const lower = url.toLowerCase();
                return lower.includes('wa.me') || lower.includes('whatsapp.com') || lower.includes('api.whatsapp');
            }

            function getPlatformFromUrl(url) {
                if (!url) return 'none';
                const lower = url.toLowerCase();
                if (isWhatsAppUrl(url)) return 'whatsapp';
                if (lower.includes('selar.co') || lower.includes('selar.com')) return 'selar';
                if (lower.includes('shopify.com') || lower.includes('myshopify.com')) return 'shopify';
                if (lower.includes('flutterwave.com') || lower.includes('paystack.com')) return 'payment';
                return 'web';
            }

            // ========== PLATFORM DATA ==========
            // Icon map for 30+ social platforms (any key not in map gets fas fa-link)
            const SOCIAL_ICON_MAP = {
                facebook: 'fab fa-facebook-f', instagram: 'fab fa-instagram', tiktok: 'fab fa-tiktok', twitter: 'fab fa-x-twitter',
                youtube: 'fab fa-youtube', linkedin: 'fab fa-linkedin-in', pinterest: 'fab fa-pinterest-p', snapchat: 'fab fa-snapchat',
                reddit: 'fab fa-reddit-alien', twitch: 'fab fa-twitch', github: 'fab fa-github', medium: 'fab fa-medium',
                substack: 'fas fa-square-rss', wordpress: 'fab fa-wordpress', tumblr: 'fab fa-tumblr', flickr: 'fab fa-flickr',
                behance: 'fab fa-behance', dribbble: 'fab fa-dribbble', spotify: 'fab fa-spotify', soundcloud: 'fab fa-soundcloud',
                apple: 'fab fa-apple', amazon: 'fab fa-amazon', etsy: 'fab fa-etsy', ebay: 'fab fa-ebay',
                aliexpress: 'fas fa-bag-shopping', patreon: 'fab fa-patreon', kickstarter: 'fab fa-kickstarter-k', quora: 'fab fa-quora',
                whatsapp: 'fab fa-whatsapp', telegram: 'fab fa-telegram', signal: 'fas fa-message', messenger: 'fab fa-facebook-messenger',
                viber: 'fab fa-viber', line: 'fab fa-line', wechat: 'fab fa-weixin'
            };
            function getSocialIcon(platform) {
                return SOCIAL_ICON_MAP[platform.toLowerCase()] || 'fas fa-link';
            }

            // Messaging platforms with priority order and URL templates
            const MESSAGING_PLATFORMS = [
                { key: 'whatsapp', name: 'WhatsApp', icon: 'fab fa-whatsapp', urlTemplate: (id) => `https://wa.me/${id.replace(/\D/g, '')}` },
                { key: 'telegram', name: 'Telegram', icon: 'fab fa-telegram', urlTemplate: (id) => `https://t.me/${id.replace('@', '')}` },
                { key: 'signal', name: 'Signal', icon: 'fas fa-message', urlTemplate: (id) => `https://signal.me/#p/${id.replace(/\D/g, '')}` },
                { key: 'messenger', name: 'Messenger', icon: 'fab fa-facebook-messenger', urlTemplate: (id) => `https://m.me/${id}` },
                { key: 'viber', name: 'Viber', icon: 'fab fa-viber', urlTemplate: (id) => `viber://chat?number=${id.replace(/\D/g, '')}` },
                { key: 'line', name: 'Line', icon: 'fab fa-line', urlTemplate: (id) => `https://line.me/ti/p/${id}` },
                { key: 'wechat', name: 'WeChat', icon: 'fab fa-weixin', urlTemplate: (id) => `https://wechat.com/u/${id}` }
            ];
            const MESSAGING_PRIORITY = ['whatsapp', 'telegram', 'signal', 'messenger', 'viber', 'line', 'wechat'];

            // ========== URL PARAMS ==========
            const searchParams = new URLSearchParams(window.location.search);
            let slug = searchParams.get('slug') || '';
            let isPreview = searchParams.get('preview') === '1' || searchParams.get('preview') === 'true';
            let emailParam = searchParams.get('email') || '';

            if (!slug) {
                const pathParts = window.location.pathname.split('/').filter(Boolean);
                if (pathParts.length > 0) {
                    const firstPart = pathParts[0];
                    const knownFiles = ['index.html', 'app.html', 'shop.html', 'install.html', 'referral.html', '404.html'];
                    if (!knownFiles.includes(firstPart) && !firstPart.endsWith('.html')) {
                        slug = firstPart;
                    }
                }
            }

            const appEl = document.getElementById('app');
            let currentShopData = null;
            let showAllSocials = false;
            let fabEl = null;

            // ========== FAB MANAGEMENT (single instance) ==========
            function createFAB() {
                if (fabEl) return fabEl;
                fabEl = document.createElement('a');
                fabEl.className = 'fab';
                fabEl.setAttribute('target', '_blank');
                fabEl.setAttribute('rel', 'noopener noreferrer');
                document.getElementById('fabContainer').appendChild(fabEl);
                return fabEl;
            }

            function updateFAB(primaryPlatform, identifier, businessName) {
                if (!fabEl) createFAB();
                if (!primaryPlatform) {
                    fabEl.style.display = 'none';
                    return;
                }
                const platform = MESSAGING_PLATFORMS.find(p => p.key === primaryPlatform);
                if (!platform) return;
                const link = platform.urlTemplate(identifier);
                const msg = encodeURIComponent('Hi ' + (businessName || 'there') + ', I found your shop on MyShop.');
                const finalLink = primaryPlatform === 'whatsapp' ? link + '?text=' + msg : link;
                fabEl.href = finalLink;
                fabEl.innerHTML = `<i class="${platform.icon}"></i>`;
                fabEl.style.background = `var(--${primaryPlatform})`;
                fabEl.style.display = window.innerWidth <= 768 ? 'flex' : 'none';
            }

            // ========== DEMO DATA (real catalog button, no fake products) ==========
            function getDemoData() {
                return {
                    shop_json: {
                        business_name: "Demo Shop",
                        tagline: "See how MyShop works",
                        description: "This is a demo hub. Sign up to create your own professional storefront.",
                        logo_url: "/icon.svg",
                        phone: "+2348012345678",
                        email: "demo@myshop.afric.site",
                        location: "Online",
                        catalog_url: "https://selar.co/myshop-demo",
                        brand_colors: { primary: "#7c3aed" },
                        socials: {
                            facebook: "https://facebook.com/myshop",
                            instagram: "https://instagram.com/myshop",
                            tiktok: "https://tiktok.com/@myshop",
                            twitter: "https://x.com/myshop",
                            youtube: "https://youtube.com/@myshop",
                            whatsapp: "+2348012345678",
                            telegram: "myshopdemo"
                        }
                    }
                };
            }

            // ========== RENDER FUNCTION (updated for dynamic socials & messaging) ==========
            function renderShop(shop, previewMode) {
                const json = shop.shop_json || shop;
                const primary = json.brand_colors?.primary || '#1e40af';
                document.documentElement.style.setProperty('--brand', primary);
                document.documentElement.style.setProperty('--brand-dark', primary);
                const metaTheme = document.querySelector('meta[name="theme-color"]');
                if (metaTheme) metaTheme.setAttribute('content', primary);

                // Separate socials and messaging
                const socials = json.socials || {};
                const socialList = [];
                const messagingList = [];

                for (let [key, url] of Object.entries(socials)) {
                    if (!url) continue;
                    const isMsg = MESSAGING_PLATFORMS.some(p => p.key === key.toLowerCase());
                    if (isMsg) {
                        // Extract identifier
                        let identifier = url;
                        if (key === 'whatsapp') identifier = url.replace(/\D/g, '');
                        else if (key === 'telegram') identifier = url.replace('https://t.me/', '').replace('@', '');
                        else if (key === 'signal') identifier = url.replace(/\D/g, '');
                        else if (key === 'messenger') identifier = url.replace('https://m.me/', '');
                        else identifier = url.split('/').pop();
                        messagingList.push({ platform: key, identifier, url });
                    } else {
                        socialList.push({ platform: key, url });
                    }
                }

                // Sort messaging by priority
                messagingList.sort((a,b) => MESSAGING_PRIORITY.indexOf(a.platform) - MESSAGING_PRIORITY.indexOf(b.platform));
                const primaryMsg = messagingList.length > 0 ? messagingList[0] : null;
                if (primaryMsg) updateFAB(primaryMsg.platform, primaryMsg.identifier, json.business_name);
                else updateFAB(null);

                const catalogUrl = json.catalog_url || '';
                const catalogType = getPlatformFromUrl(catalogUrl);
                const hasCatalog = !!catalogUrl;

                // Build nav links
                let navLinks = '';
                if (json.description) navLinks += '<a href="#about">About</a>';
                if (hasCatalog || slug === 'demo') navLinks += '<a href="#catalog">Catalog</a>';
                if (socialList.length > 0) navLinks += '<a href="#connect">Connect</a>';
                if (messagingList.length > 0 || json.phone || json.email) navLinks += '<a href="#contact">Contact</a>';

                let sections = '';

                // ABOUT
                if (json.description) {
                    sections += '<section class="section" id="about"><div class="section-title fade-in"><i class="fa-solid fa-circle-info"></i> About <div class="line"></div></div><div class="about-card fade-in"><p class="about-text">' + json.description + '</p></div></section>';
                }

                // CATALOG
                sections += '<section class="section" id="catalog"><div class="section-title fade-in"><i class="fa-solid fa-bag-shopping"></i> Catalog <div class="line"></div></div>';
                if (slug === 'demo') {
                    // Demo mode: button (no iframe) – always works
                    const demoCatalogUrl = 'https://selar.co/myshop-demo';
                    sections += `<div class="catalog-card fade-in"><div class="catalog-icon"><i class="fa-solid fa-store"></i></div><h3>Demo Catalog</h3><p>Explore our sample products</p><a href="${demoCatalogUrl}" target="_blank" rel="noopener noreferrer" class="action-btn primary"><i class="fa-solid fa-up-right-from-square"></i> View Demo Catalog</a></div>`;
                } else if (catalogType === 'whatsapp') {
                    sections += '<div class="catalog-card whatsapp-card fade-in"><div class="catalog-icon"><i class="fa-brands fa-whatsapp"></i></div><h3>WhatsApp Catalog</h3><p>Browse and order directly on WhatsApp.</p><a href="' + fixUrl(catalogUrl) + '" target="_blank" rel="noopener noreferrer" class="action-btn whatsapp"><i class="fa-brands fa-whatsapp"></i> View Catalog</a></div>';
                } else if (catalogType === 'selar' || catalogType === 'shopify' || catalogType === 'web') {
                    const platformName = { selar:'Selar', shopify:'Shopify', web:'Online' }[catalogType] || 'Store';
                    sections += '<div class="catalog-card fade-in"><div class="catalog-icon"><i class="fa-solid fa-store"></i></div><h3>' + platformName + ' Catalog</h3><p>Browse full catalog on their store.</p><a href="' + fixUrl(catalogUrl) + '" target="_blank" rel="noopener noreferrer" class="action-btn primary"><i class="fa-solid fa-up-right-from-square"></i> Open Catalog</a></div>';
                } else {
                    sections += '<div class="catalog-card coming-soon fade-in"><div class="catalog-icon"><i class="fa-solid fa-clock"></i></div><h3>Catalog Coming Soon</h3><p>Reach out directly to place an order.</p>';
                    if (primaryMsg) {
                        const msgPlatform = MESSAGING_PLATFORMS.find(p => p.key === primaryMsg.platform);
                        const chatLink = msgPlatform.urlTemplate(primaryMsg.identifier);
                        sections += '<a href="' + chatLink + '" target="_blank" rel="noopener noreferrer" class="action-btn whatsapp" style="margin-top:8px;"><i class="' + msgPlatform.icon + '"></i> Order via ' + msgPlatform.name + '</a>';
                    }
                    sections += '</div>';
                }
                sections += '</section>';

                // CONNECT (socials) – with show more toggle
                if (socialList.length > 0) {
                    const total = socialList.length;
                    const limit = 8;
                    const toShow = showAllSocials ? socialList : socialList.slice(0, limit);
                    sections += '<section class="section" id="connect"><div class="section-title fade-in"><i class="fa-solid fa-share-nodes"></i> Connect <div class="line"></div></div>';
                    // Mobile: horizontal scroll
                    sections += '<div class="social-scroll">';
                    toShow.forEach(s => {
                        const icon = getSocialIcon(s.platform);
                        const displayName = s.platform.charAt(0).toUpperCase() + s.platform.slice(1);
                        sections += `<a href="${fixUrl(s.url)}" target="_blank" rel="noopener noreferrer" class="social-item"><i class="${icon}"></i><span>${displayName}</span></a>`;
                    });
                    sections += '</div>';
                    // Desktop: grid
                    sections += '<div class="social-grid">';
                    toShow.forEach(s => {
                        const icon = getSocialIcon(s.platform);
                        const displayName = s.platform.charAt(0).toUpperCase() + s.platform.slice(1);
                        sections += `<a href="${fixUrl(s.url)}" target="_blank" rel="noopener noreferrer" class="social-item"><i class="${icon}"></i><span>${displayName}</span></a>`;
                    });
                    sections += '</div>';
                    if (total > limit) {
                        sections += `<button class="toggle-socials-btn" onclick="window.toggleSocials()">${showAllSocials ? 'Show less' : `Show all ${total} social links`}</button>`;
                    }
                    sections += '</section>';
                }

                // CONTACT (messaging)
                if (messagingList.length > 0 || json.phone || json.email) {
                    sections += '<section class="section" id="contact"><div class="section-title fade-in"><i class="fa-solid fa-address-book"></i> Contact <div class="line"></div></div>';
                    sections += '<div class="messaging-scroll">';
                    messagingList.forEach(m => {
                        const msgPlatform = MESSAGING_PLATFORMS.find(p => p.key === m.platform);
                        const chatLink = msgPlatform.urlTemplate(m.identifier);
                        const displayName = msgPlatform.name;
                        sections += `<a href="${chatLink}" target="_blank" rel="noopener noreferrer" class="messaging-item ${m.platform}">
                                        <div class="msg-icon"><i class="${msgPlatform.icon}"></i></div>
                                        <span>${displayName}</span>
                                    </a>`;
                    });
                    if (json.phone) {
                        sections += `<a href="tel:${json.phone}" class="messaging-item" style="background:none; border:1px solid var(--border);"><div class="msg-icon" style="background:var(--brand);"><i class="fa-solid fa-phone"></i></div><span>Call</span></a>`;
                    }
                    if (json.email) {
                        sections += `<a href="mailto:${json.email}" class="messaging-item" style="background:none; border:1px solid var(--border);"><div class="msg-icon" style="background:#ea4335;"><i class="fa-solid fa-envelope"></i></div><span>Email</span></a>`;
                    }
                    sections += '</div></section>';
                }

                // Build full page
                const logoUrl = json.logo_url || '/icon.svg';
                const businessName = json.business_name || 'My Hub';
                const tagline = json.tagline || '';
                const location = json.location || '';

                let html = '<nav class="navbar" id="navbar"><div class="nav-inner"><a href="/" class="nav-brand"><img src="/icon.svg" alt="MyShop"><span>MyShop</span></a><div class="nav-links">' + navLinks + '<a href="/app.html" class="nav-cta">Get Your Hub</a></div><button class="nav-toggle" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button></div></nav>';
                html += '<header class="hero"><img src="' + logoUrl + '" alt="' + businessName + '" class="hero-logo fade-in" onerror="this.src=\'/icon.svg\'"><h1 class="hero-name fade-in">' + businessName + '</h1>';
                if (tagline) html += '<p class="hero-tagline fade-in">' + tagline + '</p>';
                html += '<div class="hero-meta fade-in">';
                if (location) html += '<span><i class="fa-solid fa-location-dot"></i> ' + location + '</span>';
                html += '<span><span class="pulse-dot"></span> ' + (previewMode ? 'Pending Activation' : 'Active Store') + '</span>';
                html += '</div></header>';
                html += '<div class="quick-actions fade-in">';
                if (slug === 'demo') html += '<a href="#catalog" class="action-btn primary"><i class="fa-solid fa-bag-shopping"></i> Browse Catalog</a>';
                else if (catalogType === 'whatsapp') html += '<a href="' + fixUrl(catalogUrl) + '" target="_blank" rel="noopener noreferrer" class="action-btn whatsapp"><i class="fa-brands fa-whatsapp"></i> View Catalog</a>';
                else if (catalogType === 'selar' || catalogType === 'shopify' || catalogType === 'web') html += '<a href="' + fixUrl(catalogUrl) + '" target="_blank" rel="noopener noreferrer" class="action-btn primary"><i class="fa-solid fa-store"></i> Open Catalog</a>';
                else if (primaryMsg) {
                    const msgPlatform = MESSAGING_PLATFORMS.find(p => p.key === primaryMsg.platform);
                    const chatLink = msgPlatform.urlTemplate(primaryMsg.identifier);
                    html += '<a href="' + chatLink + '" target="_blank" rel="noopener noreferrer" class="action-btn whatsapp"><i class="' + msgPlatform.icon + '"></i> Chat on ' + msgPlatform.name + '</a>';
                }
                html += '</div>' + sections;
                html += '<footer class="site-footer"><p>Powered by <a href="/">MyShop</a> — EML Tech Studio</p><div class="watermark"><img src="/icon.svg" alt="MyShop"><span>Get your own hub at <strong>myshop.afric.site</strong></span></div></footer>';
                appEl.innerHTML = html;

                // Re-attach scroll and animation observers
                window.addEventListener('scroll', function() { const nav = document.getElementById('navbar'); if (nav) window.scrollY > 20 ? nav.classList.add('scrolled') : nav.classList.remove('scrolled'); });
                const observer = new IntersectionObserver((entries) => { entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); }); }, { threshold: 0.15 });
                document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
                setTimeout(() => { document.querySelectorAll('.fade-in').forEach(el => { if(el.getBoundingClientRect().top < window.innerHeight) el.classList.add('visible'); }); }, 100);
            }

            // ========== GLOBAL TOGGLE FOR SOCIALS ==========
            window.toggleSocials = function() {
                showAllSocials = !showAllSocials;
                if (currentShopData) renderShop(currentShopData, isPreview);
            };

            window.toggleMenu = function() {
                const links = document.querySelector('.nav-links');
                if (!links) return;
                if (links.style.display === 'flex') {
                    links.style.display = '';
                } else {
                    links.style.display = 'flex';
                    links.style.position = 'absolute';
                    links.style.top = '60px';
                    links.style.left = '0';
                    links.style.right = '0';
                    links.style.flexDirection = 'column';
                    links.style.background = 'white';
                    links.style.padding = '20px 24px';
                    links.style.boxShadow = '0 12px 32px rgba(0,0,0,0.12)';
                    links.style.gap = '16px';
                    links.style.borderBottom = '1px solid var(--border)';
                    links.style.zIndex = '999';
                }
            };

            // ========== POSTMESSAGE LISTENER (for index.html editor) ==========
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'myshop-update') {
                    const newData = event.data.data;
                    const updatedShop = {
                        shop_json: {
                            business_name: newData.business_name,
                            tagline: newData.tagline,
                            description: newData.description,
                            logo_url: newData.logo_url,
                            phone: newData.phone,
                            email: newData.email,
                            location: newData.location,
                            catalog_url: newData.catalog_url || newData.whatsapp_catalog,
                            brand_colors: { primary: '#1e40af' },
                            socials: newData.socials || {}
                        }
                    };
                    if (newData.whatsapp && !updatedShop.shop_json.socials.whatsapp) updatedShop.shop_json.socials.whatsapp = newData.whatsapp;
                    currentShopData = updatedShop;
                    renderShop(updatedShop, isPreview);
                }
            });

            // ========== MAIN LOAD LOGIC ==========
            if (!slug) {
                appEl.innerHTML = '<div class="error-state"><div class="error-card"><div class="icon">🔍</div><h2>No shop specified</h2><p>Add a shop name to the URL like <code>myshop.afric.site/your-shop</code></p><a href="/">Go to MyShop</a></div></div>';
                return;
            }

            if (slug === 'demo') {
                const demoData = getDemoData();
                currentShopData = demoData;
                renderShop(demoData, false);
                createFAB();
                return;
            }

            try {
                let endpoint;
                if (isPreview) {
                    if (!emailParam) {
                        appEl.innerHTML = '<div class="error-state"><div class="error-card"><div class="icon">🔒</div><h2>Preview requires login</h2><p>Please sign in to preview your shop.</p><a href="/app.html">Go to Dashboard</a></div></div>';
                        return;
                    }
                    endpoint = `${API}/shop/preview/${slug}?email=${encodeURIComponent(emailParam)}`;
                } else {
                    endpoint = `${API}/shop/live/${slug}`;
                }
                const res = await fetch(endpoint);
                if (!res.ok) {
                    if (res.status === 403) {
                        appEl.innerHTML = '<div class="error-state"><div class="error-card"><div class="icon">⛔</div><h2>Access Denied</h2><p>You do not own this shop, or the preview link is invalid.</p><a href="/app.html">Go to Dashboard</a></div></div>';
                        return;
                    }
                    if (res.status === 404) {
                        if (isPreview) {
                            appEl.innerHTML = '<div class="error-state"><div class="error-card"><div class="icon">👀</div><h2>Preview Not Available</h2><p>This shop doesn\'t exist yet or the preview link is invalid.</p><a href="/app.html">Go to Dashboard</a></div></div>';
                        } else {
                            appEl.innerHTML = '<div class="error-state"><div class="error-card"><div class="icon">🏪</div><h2>Shop not found</h2><p>This shop doesn\'t exist or hasn\'t been activated yet.</p><a href="/app.html">Create Your Shop</a></div></div>';
                        }
                        return;
                    }
                    throw new Error('Server error');
                }
                const shop = await res.json();
                currentShopData = shop;
                renderShop(shop, isPreview);
                createFAB();
            } catch(e) {
                appEl.innerHTML = '<div class="error-state"><div class="error-card"><div class="icon">⚠️</div><h2>Unable to load</h2><p>' + e.message + '</p><a href="/">Go Home</a></div></div>';
            }

            // Handle window resize for FAB
            window.addEventListener('resize', () => {
                if (fabEl) {
                    fabEl.style.display = window.innerWidth <= 768 ? 'flex' : 'none';
                }
            });
        })();
    </script>
</body>
</html>
