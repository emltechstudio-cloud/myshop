<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <title>MyShop &mdash; Business Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{--brand:#2563eb;--brand-light:#3b82f6;--brand-glow:rgba(37,99,235,0.08);--bg:#f8fafc;--card:#fff;--text:#0f172a;--text2:#475569;--border:#e2e8f0;--radius:24px;--shadow:0 8px 24px rgba(37,99,235,0.06);--shadow-lg:0 24px 48px -12px rgba(37,99,235,0.12);}
        @media (prefers-color-scheme: dark) {:root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--text2:#94a3b8;--border:#334155;}}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
        .shop-container{max-width:480px;margin:0 auto;background:var(--card);min-height:100vh;box-shadow:0 0 40px rgba(37,99,235,0.06);position:relative;}
        .header{background:linear-gradient(135deg,#eff6ff,#f0f9ff);padding:40px 20px 28px;text-align:center;border-bottom:1px solid var(--border);position:relative;overflow:hidden;}
        .header::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(59,130,246,0.06),transparent 60%);}
        .logo{width:100px;height:100px;border-radius:50%;object-fit:cover;margin-bottom:20px;background:#fff;border:4px solid rgba(37,99,235,0.1);box-shadow:0 12px 32px rgba(37,99,235,0.15);position:relative;transition:all 0.3s;}
        .logo:hover{transform:scale(1.05);}
        .logo-placeholder{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,var(--brand-light),var(--brand));margin:0 auto 20px;display:flex;align-items:center;justify-content:center;color:white;font-size:2.2rem;font-weight:800;position:relative;box-shadow:0 12px 32px rgba(37,99,235,0.25);}
        .business-name{font-size:1.9rem;font-weight:800;margin-bottom:8px;position:relative;}
        .tagline{color:var(--text2);font-size:1rem;margin-bottom:10px;font-weight:500;position:relative;}
        .description{color:var(--text2);font-size:0.9rem;margin-top:12px;line-height:1.7;position:relative;}
        .location-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(37,99,235,0.08);color:var(--brand);padding:8px 16px;border-radius:20px;font-size:0.85rem;font-weight:600;margin-top:12px;position:relative;}
        .contact-section{padding:28px 16px;background:white;}
        .contact-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
        .contact-btn{padding:14px 22px;border-radius:50px;text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:8px;font-size:0.85rem;transition:all 0.3s;border:none;cursor:pointer;position:relative;overflow:hidden;}
        .contact-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);transform:translateX(-100%);transition:transform 0.5s;}
        .contact-btn:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(0,0,0,0.15);}
        .contact-btn:hover::after{transform:translateX(100%);}
        .contact-btn.whatsapp{background:linear-gradient(135deg,#25D366,#128C7E);color:white;}
        .contact-btn.call{background:linear-gradient(135deg,#10b981,#059669);color:white;}
        .contact-btn.email{background:linear-gradient(135deg,#6b7280,#4b5563);color:white;}
        .contact-btn.message{background:linear-gradient(135deg,var(--brand),var(--brand-light));color:white;}
        .catalog-section{margin:16px 16px 0;background:white;border-radius:20px;border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow);transition:all 0.3s;}
        .catalog-section:hover{box-shadow:var(--shadow-lg);}
        .catalog-label{background:linear-gradient(135deg,#f8fafc,#f1f5f9);padding:16px 20px;font-weight:700;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:0.95rem;}
        .catalog-label i{color:var(--brand);}
        .catalog-iframe{width:100%;height:420px;border:none;background:#f8fafc;}
        .catalog-fallback{padding:48px 24px;text-align:center;background:#f8fafc;}
        .catalog-fallback i{font-size:2.5rem;color:var(--brand-light);margin-bottom:16px;display:block;}
        .catalog-fallback p{color:var(--text2);margin-bottom:20px;font-size:0.9rem;}
        .catalog-fallback a{background:linear-gradient(135deg,var(--brand),var(--brand-light));color:white;padding:14px 32px;border-radius:50px;text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:all 0.3s;position:relative;overflow:hidden;}
        .catalog-fallback a::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);transform:translateX(-100%);transition:transform 0.5s;}
        .catalog-fallback a:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(37,99,235,0.3);}
        .catalog-fallback a:hover::after{transform:translateX(100%);}
        .whatsapp-catalog{margin:16px 16px 0;background:linear-gradient(135deg,#f0fdf4,#dcfce7);border-radius:20px;padding:24px;text-align:center;border:1px solid #bbf7d0;transition:all 0.3s;}
        .whatsapp-catalog:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(37,211,102,0.15);}
        .whatsapp-catalog i{font-size:2.4rem;color:#25D366;margin-bottom:12px;}
        .whatsapp-catalog p{margin:10px 0 16px;color:#166534;font-weight:500;font-size:0.95rem;}
        .whatsapp-catalog a{background:linear-gradient(135deg,#25D366,#128C7E);color:white;padding:14px 32px;border-radius:50px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;font-weight:700;transition:all 0.3s;position:relative;overflow:hidden;}
        .whatsapp-catalog a::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);transform:translateX(-100%);transition:transform 0.5s;}
        .whatsapp-catalog a:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(37,211,102,0.3);}
        .whatsapp-catalog a:hover::after{transform:translateX(100%);}
        .social-section{padding:32px 16px;text-align:center;}
        .social-section h3{font-size:0.85rem;color:var(--text2);margin-bottom:20px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;}
        .social-links{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;}
        .social-icon{width:52px;height:52px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;color:var(--text2);text-decoration:none;font-size:1.3rem;transition:all 0.3s;position:relative;overflow:hidden;}
        .social-icon::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--brand),var(--brand-light));opacity:0;transition:opacity 0.3s;}
        .social-icon i{position:relative;z-index:1;transition:color 0.3s;}
        .social-icon:hover{transform:translateY(-4px) scale(1.1);box-shadow:0 12px 24px rgba(37,99,235,0.25);}
        .social-icon:hover::before{opacity:1;}
        .social-icon:hover i{color:white;}
        .footer-note{text-align:center;padding:32px 20px;color:#94a3b8;font-size:0.8rem;border-top:1px solid var(--border);margin-top:20px;background:white;}
        .footer-note a{color:var(--brand);text-decoration:none;font-weight:600;transition:color 0.2s;}
        .footer-note a:hover{color:var(--brand-dark);}
        .loader{text-align:center;padding:100px 20px;color:var(--text2);}
        .loader i{font-size:2.5rem;color:var(--brand-light);margin-bottom:16px;display:block;animation:spin 1s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}
        .error{padding:80px 20px;text-align:center;}
        .error i{font-size:3rem;color:#ef4444;margin-bottom:16px;}
        .error h2{font-size:1.4rem;margin-bottom:10px;}
        .error p{color:var(--text2);margin-bottom:24px;}
        .error a{background:linear-gradient(135deg,var(--brand),var(--brand-light));color:white;padding:14px 28px;border-radius:50px;text-decoration:none;font-weight:600;display:inline-block;transition:all 0.3s;}
        .error a:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(37,99,235,0.3);}
        .demo-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:14px 28px;border-radius:40px;font-size:0.9rem;z-index:9999;box-shadow:0 12px 32px rgba(0,0,0,0.25);animation:slideUp 0.4s cubic-bezier(0.16,1,0.3,1);}
        @keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(20px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
        .back-bar{padding:14px 16px;background:white;border-bottom:1px solid var(--border);display:none;align-items:center;gap:8px;}
        .back-bar.show{display:flex;}
        .back-bar a{color:var(--text2);text-decoration:none;font-size:0.85rem;font-weight:500;display:flex;align-items:center;gap:6px;transition:all 0.2s;}
        .back-bar a:hover{color:var(--brand);gap:10px;}
        @media(max-width:480px){
            .contact-btn{padding:12px 18px;font-size:0.8rem;}
            .business-name{font-size:1.6rem;}
            .catalog-iframe{height:350px;}
        }
    </style>
</head>
<body>
<div id="back-bar" class="back-bar">
    <a href="/preview.html"><i class="fa-solid fa-arrow-left"></i> Back to builder</a>
</div>
<div id="shop-root" class="shop-container">
    <div class="loader">
        <i class="fa-solid fa-circle-notch"></i>
        <div>Loading your hub...</div>
    </div>
</div>
<script>
    const API = 'https://emltechstudio-myshop-api.hf.space';
    let shopData = null;
    let isDemoMode = false;

    function showDemoToast(msg) {
        const existing = document.querySelector('.demo-toast');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = 'demo-toast';
        toast.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles" style="margin-right:8px;"></i>${msg || 'Demo mode &mdash; create your own hub to use this'}`;
        document.body.appendChild(toast);
        setTimeout(() => { if(toast.parentNode) toast.remove(); }, 3500);
    }

    function getPlatformLabel(url) {
        if (!url) return 'Catalog';
        const l = url.toLowerCase();
        if (l.includes('selar.co')) return 'Selar Store';
        if (l.includes('shopify')) return 'Shopify Store';
        if (l.includes('woocommerce')) return 'WooCommerce Store';
        if (l.includes('paystack')) return 'Paystack Store';
        if (l.includes('flutterwave')) return 'Flutterwave Store';
        if (l.includes('google.com')) return 'Product Catalog';
        return 'Online Store';
    }

    function renderShop(data) {
        const root = document.getElementById('shop-root');
        const business = data.business_name || 'My Business';
        const tagline = data.tagline || '';
        const description = data.description || '';
        const phone = data.phone || '';
        const whatsappNum = data.whatsapp || phone;
        const email = data.email || '';
        const location = data.location || '';
        const catalogUrl = data.catalog_url || '';
        const waCatalogUrl = data.wa_catalog_url || '';
        const logo = data.logo_url || '';
        const socials = {
            instagram: data.instagram || '',
            tiktok: data.tiktok || '',
            facebook: data.facebook || '',
            twitter: data.twitter || ''
        };
        const platformLabel = getPlatformLabel(catalogUrl);
        const hasSocials = socials.instagram || socials.tiktok || socials.facebook || socials.twitter;

        const initials = business.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();

        root.innerHTML = `
            <div class="header">
                ${logo ? `<img src="${logo}" class="logo" alt="${business} logo">` : `<div class="logo-placeholder">${initials}</div>`}
                <h1 class="business-name">${escapeHtml(business)}</h1>
                ${tagline ? `<div class="tagline">${escapeHtml(tagline)}</div>` : ''}
                ${description ? `<div class="description">${escapeHtml(description)}</div>` : ''}
                ${location ? `<div class="location-badge"><i class="fa-solid fa-location-dot"></i> ${escapeHtml(location)}</div>` : ''}
            </div>
            <div class="contact-section">
                <div class="contact-buttons">
                    ${phone ? `<a href="tel:${phone}" class="contact-btn call"><i class="fa-solid fa-phone"></i> Call</a>` : ''}
                    ${whatsappNum ? `<a href="https://wa.me/${whatsappNum.replace(/\\D/g,'')}?text=Hello%21%20I%27m%20interested%20in%20your%20products" target="_blank" class="contact-btn whatsapp"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>` : ''}
                    ${email ? `<a href="mailto:${email}" class="contact-btn email"><i class="fa-solid fa-envelope"></i> Email</a>` : ''}
                    ${whatsappNum ? `<a href="https://wa.me/${whatsappNum.replace(/\\D/g,'')}?text=Hello%21%20I%27m%20interested%20in%20your%20products" target="_blank" class="contact-btn message"><i class="fa-solid fa-comment-dots"></i> Message</a>` : ''}
                </div>
            </div>
            ${catalogUrl ? `
            <div class="catalog-section">
                <div class="catalog-label"><i class="fa-solid fa-store"></i> ${platformLabel}</div>
                <iframe src="${catalogUrl}" class="catalog-iframe" title="${platformLabel}" sandbox="allow-same-origin allow-scripts allow-popups allow-forms" loading="lazy" onload="this.style.opacity=1" style="opacity:0;transition:opacity 0.5s;"></iframe>
                <div class="catalog-fallback" id="fallbackMsg" style="display:none;">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <p>Your browser may block the embedded catalog.<br>No worries &mdash; you can still browse it directly.</p>
                    <a href="${catalogUrl}" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square"></i> Browse ${platformLabel}</a>
                </div>
            </div>
            ` : ''}
            ${waCatalogUrl ? `
            <div class="whatsapp-catalog">
                <i class="fa-brands fa-whatsapp"></i>
                <p>View our catalog on WhatsApp</p>
                <a href="${waCatalogUrl}" target="_blank"><i class="fa-brands fa-whatsapp"></i> Open on WhatsApp</a>
            </div>
            ` : ''}
            ${hasSocials ? `
            <div class="social-section">
                <h3>Follow Us</h3>
                <div class="social-links">
                    ${socials.instagram ? `<a href="${socials.instagram}" target="_blank" class="social-icon" title="Instagram"><i class="fa-brands fa-instagram"></i></a>` : ''}
                    ${socials.tiktok ? `<a href="${socials.tiktok}" target="_blank" class="social-icon" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>` : ''}
                    ${socials.facebook ? `<a href="${socials.facebook}" target="_blank" class="social-icon" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>` : ''}
                    ${socials.twitter ? `<a href="${socials.twitter}" target="_blank" class="social-icon" title="Twitter"><i class="fa-brands fa-x-twitter"></i></a>` : ''}
                </div>
            </div>
            ` : ''}
            <div class="footer-note">
                <div style="margin-bottom:8px;"><i class="fa-solid fa-bolt" style="color:var(--brand);"></i> Powered by <a href="/" target="_blank">MyShop</a></div>
                <div style="font-size:0.7rem;">One link for your business</div>
            </div>
        `;

        if (catalogUrl) {
            const iframe = root.querySelector('.catalog-iframe');
            if (iframe) {
                iframe.onerror = () => showFallback();
                setTimeout(() => {
                    try { iframe.contentWindow.location.href; } catch(e) { showFallback(); }
                }, 3000);
            }
        }

        function showFallback() {
            const fb = document.getElementById('fallbackMsg');
            const ifr = root.querySelector('.catalog-iframe');
            if (fb) fb.style.display = 'block';
            if (ifr) ifr.style.display = 'none';
        }

        if (isDemoMode) {
            root.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    showDemoToast();
                });
            });
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function loadShop() {
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');
        const previewMode = urlParams.get('preview') === '1';
        const previewEmail = urlParams.get('email');
        const encodedData = urlParams.get('data');

        if (encodedData || (previewMode && previewEmail)) {
            document.getElementById('back-bar').classList.add('show');
        }

        if (encodedData) {
            try {
                const decoded = JSON.parse(decodeURIComponent(encodedData));
                renderShop(decoded);
                isDemoMode = true;
                return;
            } catch(e) { console.warn('Preview data parse error:', e); }
        }

        if (previewMode && previewEmail && slug) {
            try {
                const res = await fetch(`${API}/shop/preview/${slug}?email=${encodeURIComponent(previewEmail)}`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                renderShop(data.shop_json || data);
                return;
            } catch(e) {
                document.getElementById('shop-root').innerHTML = `
                    <div class="error">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <h2>Could not load preview</h2>
                        <p>The server may be waking up. Please refresh in a few seconds.</p>
                        <a href="/preview.html">Back to builder</a>
                    </div>`;
                return;
            }
        }

        let shopSlug = slug;
        if (!shopSlug) {
            const parts = window.location.pathname.split('/').filter(p => p);
            if (parts.length > 0) shopSlug = parts[0];
        }
        if (shopSlug && shopSlug !== 'shop.html') {
            try {
                const res = await fetch(`${API}/shop/live/${shopSlug}`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                renderShop(data.shop_json || data);
                return;
            } catch(e) {
                document.getElementById('shop-root').innerHTML = `
                    <div class="error">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <h2>Shop not found</h2>
                        <p>This shop does not exist or is inactive.</p>
                        <a href="/preview.html">Create your own hub &rarr;</a>
                    </div>`;
                return;
            }
        }

        const demoFallback = {
            business_name: "Luxe Fashion Store",
            tagline: "Premium & Sustainable Style",
            description: "Shop the latest collection of eco-friendly fashion. Worldwide shipping available.",
            phone: "+2349012345678",
            whatsapp: "+2349012345678",
            email: "hello@luxefashion.com",
            location: "Lagos, Nigeria",
            catalog_url: "https://selar.co/m/luxefashion",
            wa_catalog_url: "https://wa.me/c/2349012345678",
            instagram: "#",
            tiktok: "#",
            facebook: "#",
            twitter: "#"
        };
        renderShop(demoFallback);
        isDemoMode = true;
        showDemoToast();
    }

    loadShop();
</script>
</body>
</html>
