<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1e40af">
    <title>MyShop Hub</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --text2: #475569;
            --text3: #94a3b8;
            --border: #e2e8f0;
            --brand: #1e40af;
            --brand-light: #3b82f6;
            --brand-dark: #1e3a8a;
            --success: #10b981;
            --warning: #f59e0b;
            --whatsapp: #25d366;
            --radius: 20px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.06);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.1);
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        html{scroll-behavior:smooth;}
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid transparent;
            transition: all var(--transition);
        }
        .navbar.scrolled {
            border-bottom-color: var(--border);
            box-shadow: var(--shadow-md);
        }
        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .nav-brand img { width: 34px; height: 34px; border-radius: 8px; }
        .nav-brand span {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--brand);
            letter-spacing: -0.5px;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
        }
        .nav-links a {
            color: var(--text2);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.88rem;
            transition: color 0.2s;
            position: relative;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--brand);
            border-radius: 2px;
            transition: width 0.25s;
        }
        .nav-links a:hover { color: var(--brand); }
        .nav-links a:hover::after { width: 100%; }
        .nav-cta {
            background: var(--brand);
            color: white !important;
            padding: 10px 22px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all var(--transition);
            box-shadow: 0 4px 14px rgba(30,64,175,0.2);
        }
        .nav-cta:hover {
            background: var(--brand-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(30,64,175,0.3);
        }
        .nav-cta::after { display: none !important; }
        .nav-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.4rem;
            color: var(--text);
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            transition: background 0.2s;
        }
        .nav-toggle:active { background: var(--border); }

        /* ===== HERO ===== */
        .hero {
            position: relative;
            padding: 130px 24px 70px;
            text-align: center;
            background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -40%; left: -30%;
            width: 160%; height: 180%;
            background:
                radial-gradient(ellipse at 30% 40%, rgba(30,64,175,0.05) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 20%, rgba(59,130,246,0.04) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 80%, rgba(16,185,129,0.03) 0%, transparent 50%);
            pointer-events: none;
        }
        .hero > * { position: relative; z-index: 1; }
        .hero-logo {
            width: 120px;
            height: 120px;
            border-radius: 28px;
            object-fit: cover;
            margin: 0 auto 20px;
            border: 4px solid white;
            box-shadow: 0 8px 36px rgba(0,0,0,0.1);
            background: white;
            transition: transform var(--transition);
        }
        .hero-logo:hover { transform: scale(1.04); }
        .hero-name {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: -1.5px;
            margin-bottom: 8px;
            color: var(--text);
        }
        .hero-tagline {
            font-size: 1.15rem;
            color: var(--text2);
            font-weight: 500;
            max-width: 520px;
            margin: 0 auto 24px;
            opacity: 0.9;
        }
        .hero-meta {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            color: var(--text3);
            font-size: 0.9rem;
        }
        .hero-meta span {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        /* ===== PULSE DOT ===== */
        .pulse-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.5); }
        }

        /* ===== PREVIEW BADGE ===== */
        .preview-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #fef3c7;
            color: #92400e;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid #fde68a;
            margin-bottom: 16px;
        }

        /* ===== QUICK ACTIONS ===== */
        .quick-actions {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            padding: 0 24px 40px;
            max-width: 700px;
            margin: 0 auto;
        }
        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all var(--transition);
            border: none;
            cursor: pointer;
            white-space: nowrap;
        }
        .action-btn.primary {
            background: var(--brand);
            color: white;
            box-shadow: 0 8px 24px rgba(30,64,175,0.25);
        }
        .action-btn.primary:hover {
            background: var(--brand-dark);
            transform: translateY(-3px);
            box-shadow: 0 14px 36px rgba(30,64,175,0.35);
        }
        .action-btn.whatsapp {
            background: var(--whatsapp);
            color: white;
            box-shadow: 0 8px 24px rgba(37,211,102,0.25);
        }
        .action-btn.whatsapp:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 36px rgba(37,211,102,0.35);
        }
        .action-btn.ghost {
            background: white;
            color: var(--text);
            border: 2px solid var(--border);
        }
        .action-btn.ghost:hover {
            border-color: var(--brand);
            color: var(--brand);
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
        .action-btn.outline-light {
            background: rgba(255,255,255,0.9);
            color: var(--brand);
            border: 2px solid var(--brand);
            font-weight: 600;
        }
        .action-btn.outline-light:hover {
            background: var(--brand);
            color: white;
            transform: translateY(-3px);
        }

        /* ===== SECTIONS ===== */
        .section {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 24px;
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .section-title i { color: var(--brand); font-size: 1.3rem; }
        .section-title .line {
            flex: 1;
            height: 2px;
            background: var(--border);
            border-radius: 2px;
        }

        /* ===== ABOUT ===== */
        .about-card {
            background: var(--card);
            padding: 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: box-shadow var(--transition);
        }
        .about-card:hover { box-shadow: var(--shadow-md); }
        .about-text {
            color: var(--text2);
            font-size: 1.05rem;
            line-height: 1.8;
        }

        /* ===== CATALOG CARDS ===== */
        .catalog-card {
            background: var(--card);
            padding: 40px 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            text-align: center;
            transition: all var(--transition);
        }
        .catalog-card:hover { box-shadow: var(--shadow-md); }
        .catalog-card.whatsapp-card {
            background: linear-gradient(135deg, #dcfce7, #d1fae5);
            border-color: #bbf7d0;
        }
        .catalog-card.coming-soon {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border-color: #fcd34d;
        }
        .catalog-icon {
            font-size: 3.5rem;
            margin-bottom: 16px;
        }
        .catalog-card h3 {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--text);
        }
        .catalog-card p {
            color: var(--text2);
            margin-bottom: 20px;
            font-size: 0.95rem;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
        }
        .whatsapp-card h3 { color: #166534; }
        .whatsapp-card p { color: #15803d; }
        .coming-soon h3 { color: #92400e; }
        .coming-soon p { color: #a16207; }

        /* ===== PRODUCTS GRID (demo only) ===== */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: all var(--transition);
            text-decoration: none;
            color: var(--text);
            cursor: default;
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }
        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, #e2e8f0, #f1f5f9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
        }
        .product-info { padding: 16px; }
        .product-name {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .product-price {
            color: var(--brand);
            font-weight: 800;
            font-size: 1.1rem;
        }
        .product-badge {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 8px;
        }

        /* ===== ICON ROW ===== */
        .icon-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 24px 0;
        }
        .icon-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            font-size: 1.5rem;
            color: white;
            text-decoration: none;
            transition: all var(--transition);
            background: var(--brand);
            box-shadow: var(--shadow-sm);
        }
        .icon-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 24px rgba(0,0,0,0.18);
        }
        .icon-btn.whatsapp { background: var(--whatsapp); }
        .icon-btn.email { background: #ea4335; }
        .icon-btn.facebook { background: #1877f2; }
        .icon-btn.instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .icon-btn.tiktok { background: #000; }
        .icon-btn.twitter { background: #1da1f2; }
        .icon-label {
            font-size: 0.78rem;
            color: var(--text3);
            text-align: center;
            font-weight: 500;
        }

        /* ===== FAB ===== */
        .fab {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: var(--whatsapp);
            color: white;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 8px 28px rgba(37,211,102,0.35);
            z-index: 999;
            text-decoration: none;
            transition: all var(--transition);
        }
        .fab:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 36px rgba(37,211,102,0.45);
        }
        @media (max-width: 640px) { .fab { display: flex; } }

        /* ===== FOOTER ===== */
        .site-footer {
            text-align: center;
            padding: 40px 24px;
            color: var(--text3);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }
        .site-footer a { color: var(--brand); text-decoration: none; font-weight: 600; }
        .watermark {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--card);
            padding: 12px 24px;
            border-radius: 50px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            margin-top: 16px;
            transition: box-shadow var(--transition);
        }
        .watermark:hover { box-shadow: var(--shadow-md); }
        .watermark img { width: 24px; height: 24px; border-radius: 6px; }

        /* ===== LOADING & ERROR ===== */
        .loading-screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border);
            border-top-color: var(--brand);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-state {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .error-card {
            background: var(--card);
            padding: 48px 36px;
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            text-align: center;
            max-width: 440px;
            width: 100%;
        }
        .error-card .icon { font-size: 4rem; margin-bottom: 16px; }
        .error-card h2 { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; }
        .error-card p { color: var(--text2); margin-bottom: 24px; line-height: 1.6; }
        .error-card code {
            background: #f1f5f9;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .error-card a {
            display: inline-block;
            background: var(--brand);
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            transition: all var(--transition);
            box-shadow: 0 4px 14px rgba(30,64,175,0.2);
        }
        .error-card a:hover {
            background: var(--brand-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(30,64,175,0.3);
        }

        /* ===== ANIMATIONS ===== */
        .fade-in {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== MOBILE ===== */
        @media (max-width: 640px) {
            .nav-links { display: none; }
            .nav-toggle { display: block; }
            .hero { padding: 100px 16px 50px; }
            .hero-name { font-size: 2rem; }
            .hero-logo { width: 90px; height: 90px; }
            .hero-tagline { font-size: 1rem; }
            .section { padding: 40px 16px; }
            .section-title { font-size: 1.25rem; }
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .product-img { height: 150px; font-size: 2.5rem; }
            .quick-actions { padding: 0 16px 32px; gap: 10px; }
            .action-btn { padding: 13px 22px; font-size: 0.88rem; }
            .icon-btn { width: 48px; height: 48px; font-size: 1.3rem; }
            .icon-row { gap: 14px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading-screen">
            <div class="spinner"></div>
            <p style="color: var(--text2); font-weight: 500;">Loading your hub...</p>
        </div>
    </div>

    <script>
        (async function() {
            const API = 'https://emltechstudio-myshop-api.hf.space';

            function fixUrl(url) {
                if (!url) return '#';
                url = url.trim();
                if (url.startsWith('http://') || url.startsWith('https://')) return url;
                return 'https://' + url;
            }

            function isWhatsAppUrl(url) {
                if (!url) return false;
                const lower = url.toLowerCase();
                return lower.includes('wa.me') || lower.includes('whatsapp.com') || lower.includes('api.whatsapp');
            }

            function getPlatformFromUrl(url) {
                if (!url) return 'none';
                const lower = url.toLowerCase();
                if (isWhatsAppUrl(url)) return 'whatsapp';
                if (lower.includes('selar.co') || lower.includes('selar.com')) return 'selar';
                if (lower.includes('shopify.com') || lower.includes('myshopify.com')) return 'shopify';
                if (lower.includes('flutterwave.com') || lower.includes('paystack.com')) return 'payment';
                return 'web';
            }

            let slug = '';
            let isPreview = false;
            const fullPath = window.location.pathname;
            const searchParams = new URLSearchParams(window.location.search);

            // Check for preview mode
            if (searchParams.has('preview') && searchParams.get('preview') === 'true') {
                isPreview = true;
            }

            if (searchParams.has('slug')) {
                slug = searchParams.get('slug');
            } else {
                const pathParts = fullPath.split('/').filter(Boolean);
                if (pathParts.length > 0) {
                    const firstPart = pathParts[0];
                    const knownFiles = ['index.html', 'app.html', 'shop.html', 'install.html', 'referral.html', '404.html'];
                    if (!knownFiles.includes(firstPart) && !firstPart.endsWith('.html')) {
                        slug = firstPart;
                    }
                }
            }

            const appEl = document.getElementById('app');

            if (!slug) {
                appEl.innerHTML = '<div class="error-state"><div class="error-card"><div class="icon">🔍</div><h2>No shop specified</h2><p>Add a shop name to the URL like <code>myshop.afric.site/your-shop</code></p><a href="/">Go to MyShop</a></div></div>';
                return;
            }

            if (slug === 'demo') {
                renderShop(getDemoData(), false);
                return;
            }

            // Try live endpoint first, then preview if owner
            try {
                const endpoint = isPreview ? '/shop/preview/' + slug : '/shop/live/' + slug;
                const res = await fetch(API + endpoint);
                if (!res.ok) {
                    if (res.status === 404) {
                        if (isPreview) {
                            appEl.innerHTML = '<div class="error-state"><div class="error-card"><div class="icon">👀</div><h2>Preview Not Available</h2><p>This shop doesn\'t exist yet or the preview link is invalid.</p><a href="/app.html">Go to Dashboard</a></div></div>';
                        } else {
                            appEl.innerHTML = '<div class="error-state"><div class="error-card"><div class="icon">🏪</div><h2>"' + slug + '" not found</h2><p>This shop doesn\'t exist or hasn\'t been activated yet.</p><a href="/app.html">Create Your Shop</a></div></div>';
                        }
                        return;
                    }
                    throw new Error('Server error');
                }
                const shop = await res.json();
                renderShop(shop, isPreview);
            } catch(e) {
                appEl.innerHTML = '<div class="error-state"><div class="error-card"><div class="icon">⚠️</div><h2>Unable to load</h2><p>' + e.message + '</p><a href="/">Go Home</a></div></div>';
            }

            function getDemoData() {
                return {
                    shop_json: {
                        business_name: "Luxe Fashion Store",
                        tagline: "Premium fashion & accessories delivered to your door",
                        description: "We curate the finest fashion pieces from around the world. From elegant dresses to statement accessories, every item is handpicked for quality and style. Shop with confidence — we deliver nationwide within 3-5 business days.",
                        logo_url: "/icon.svg",
                        phone: "+2348012345678",
                        email: "hello@luxefashion.ng",
                        location: "Lagos, Nigeria",
                        catalog_url: "https://wa.me/c/2348012345678",
                        brand_colors: { primary: "#7c3aed" },
                        socials: {
                            facebook: "https://facebook.com/luxefashion",
                            instagram: "https://instagram.com/luxefashion",
                            tiktok: "https://tiktok.com/@luxefashion",
                            twitter: "https://x.com/luxefashion"
                        }
                    }
                };
            }

            function renderShop(shop, previewMode) {
                const json = shop.shop_json || shop;
                const primary = json.brand_colors?.primary || '#1e40af';
                document.documentElement.style.setProperty('--brand', primary);
                document.documentElement.style.setProperty('--brand-dark', primary);
                document.querySelector('meta[name="theme-color"]').setAttribute('content', primary);

                const waNum = (json.socials?.whatsapp || json.phone || '').replace(/\D/g, '');
                const waMsg = encodeURIComponent('Hi ' + (json.business_name || 'there') + ', I found your shop on MyShop and I\'m interested in your products.');
                const waLink = waNum ? 'https://wa.me/' + waNum + '?text=' + waMsg : '#';

                const catalogUrl = json.catalog_url || '';
                const catalogType = getPlatformFromUrl(catalogUrl);
                const hasCatalog = !!catalogUrl;

                // Build nav links
                let navLinks = '';
                if (json.description) navLinks += '<a href="#about">About</a>';
                if (hasCatalog || slug === 'demo') navLinks += '<a href="#catalog">Catalog</a>';
                if (json.socials && Object.keys(json.socials).filter(k => ['facebook','instagram','tiktok','twitter'].includes(k) && json.socials[k]).length > 0) {
                    navLinks += '<a href="#connect">Connect</a>';
                }
                if (json.phone || waNum || json.email) navLinks += '<a href="#contact">Contact</a>';

                let sections = '';

                // PREVIEW BADGE
                if (previewMode) {
                    sections += '<section style="text-align:center; padding:20px 24px 0;"><div class="preview-badge"><i class="fa-solid fa-eye"></i> Preview Mode — This shop is not yet live</div></section>';
                }

                // ABOUT
                if (json.description) {
                    sections += '<section class="section" id="about"><div class="section-title fade-in"><i class="fa-solid fa-circle-info"></i> About <div class="line"></div></div><div class="about-card fade-in"><p class="about-text">' + json.description + '</p></div></section>';
                }

                // CATALOG
                sections += '<section class="section" id="catalog"><div class="section-title fade-in"><i class="fa-solid fa-bag-shopping"></i> Catalog <div class="line"></div></div>';

                if (slug === 'demo') {
                    // Demo products
                    sections += '<div class="products-grid">';
                    const demoProducts = [
                        { name: "Silk Evening Dress", price: "₦45,000", emoji: "👗", badge: "Best Seller" },
                        { name: "Leather Handbag", price: "₦28,500", emoji: "👜", badge: "New" },
                        { name: "Gold Chain Necklace", price: "₦15,000", emoji: "📿", badge: "" },
                        { name: "Designer Sunglasses", price: "₦22,000", emoji: "🕶️", badge: "Trending" },
                        { name: "Casual Sneakers", price: "₦35,000", emoji: "👟", badge: "" },
                        { name: "Wrist Watch", price: "₦55,000", emoji: "⌚", badge: "Premium" }
                    ];
                    demoProducts.forEach(function(p, i) {
                        sections += '<div class="product-card fade-in"><div class="product-img">' + p.emoji + '</div><div class="product-info"><div class="product-name">' + p.name + '</div><div class="product-price">' + p.price + '</div>' + (p.badge ? '<span class="product-badge">' + p.badge + '</span>' : '') + '</div></div>';
                    });
                    sections += '</div>';
                    if (waNum) {
                        sections += '<div style="text-align:center;margin-top:28px;"><a href="' + waLink + '" target="_blank" rel="noopener noreferrer" class="action-btn whatsapp"><i class="fa-brands fa-whatsapp"></i> Order on WhatsApp</a></div>';
                    }
                } else if (catalogType === 'whatsapp') {
                    // WhatsApp catalog
                    sections += '<div class="catalog-card whatsapp-card fade-in"><div class="catalog-icon">🛒</div><h3><i class="fa-brands fa-whatsapp"></i> WhatsApp Catalog</h3><p>This seller\'s catalog is on WhatsApp. Tap below to browse and order directly.</p><a href="' + fixUrl(catalogUrl) + '" target="_blank" rel="noopener noreferrer" class="action-btn whatsapp"><i class="fa-brands fa-whatsapp"></i> View Catalog on WhatsApp</a></div>';
                } else if (catalogType === 'selar' || catalogType === 'shopify' || catalogType === 'web') {
                    // Regular web catalog
                    const platformNames = { selar: 'Selar', shopify: 'Shopify', web: 'Online' };
                    const platformName = platformNames[catalogType] || 'Online';
                    sections += '<div class="catalog-card fade-in"><div class="catalog-icon">🏬</div><h3><i class="fa-solid fa-store"></i> ' + platformName + ' Catalog</h3><p>Browse this seller\'s full catalog on their ' + platformName + ' store.</p><a href="' + fixUrl(catalogUrl) + '" target="_blank" rel="noopener noreferrer" class="action-btn primary"><i class="fa-solid fa-up-right-from-square"></i> Open Catalog</a></div>';
                } else {
                    // No catalog
                    sections += '<div class="catalog-card coming-soon fade-in"><div class="catalog-icon">📦</div><h3><i class="fa-solid fa-clock"></i> Catalog Coming Soon</h3><p>This seller is setting up their catalog. Reach out directly to place an order.</p>';
                    if (waNum) {
                        sections += '<a href="' + waLink + '" target="_blank" rel="noopener noreferrer" class="action-btn whatsapp" style="margin-top:8px;"><i class="fa-brands fa-whatsapp"></i> Order via WhatsApp</a>';
                    }
                    sections += '</div>';
                }
                sections += '</section>';

                // SOCIALS
                const socials = json.socials || {};
                const platforms = {
                    facebook: { icon: 'fa-brands fa-facebook-f', cls: 'facebook', label: 'Facebook' },
                    instagram: { icon: 'fa-brands fa-instagram', cls: 'instagram', label: 'Instagram' },
                    tiktok: { icon: 'fa-brands fa-tiktok', cls: 'tiktok', label: 'TikTok' },
                    twitter: { icon: 'fa-brands fa-x-twitter', cls: 'twitter', label: 'X' }
                };
                let socialIcons = '';
                for (let [key, cfg] of Object.entries(platforms)) {
                    if (socials[key]) {
                        const safeUrl = fixUrl(socials[key]);
                        socialIcons += '<div class="icon-wrapper"><a href="' + safeUrl + '" target="_blank" rel="noopener noreferrer" class="icon-btn ' + cfg.cls + '" title="' + cfg.label + '"><i class="' + cfg.icon + '"></i></a><span class="icon-label">' + cfg.label + '</span></div>';
                    }
                }
                if (socialIcons) {
                    sections += '<section class="section" id="connect"><div class="section-title fade-in"><i class="fa-solid fa-share-nodes"></i> Connect <div class="line"></div></div><div class="icon-row fade-in">' + socialIcons + '</div></section>';
                }

                // CONTACT
                let contactIcons = '';
                if (json.phone) {
                    contactIcons += '<div class="icon-wrapper"><a href="tel:' + json.phone + '" class="icon-btn" title="Call"><i class="fa-solid fa-phone"></i></a><span class="icon-label">Call</span></div>';
                }
                if (waNum) {
                    contactIcons += '<div class="icon-wrapper"><a href="' + waLink + '" target="_blank" rel="noopener noreferrer" class="icon-btn whatsapp" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a><span class="icon-label">WhatsApp</span></div>';
                }
                if (json.email) {
                    contactIcons += '<div class="icon-wrapper"><a href="mailto:' + json.email + '" class="icon-btn email" title="Email"><i class="fa-solid fa-envelope"></i></a><span class="icon-label">Email</span></div>';
                }
                if (contactIcons) {
                    sections += '<section class="section" id="contact"><div class="section-title fade-in"><i class="fa-solid fa-address-book"></i> Contact <div class="line"></div></div><div class="icon-row fade-in">' + contactIcons + '</div></section>';
                }

                // BUILD FULL PAGE
                const logoUrl = json.logo_url || '/icon.svg';
                const businessName = json.business_name || 'My Hub';
                const tagline = json.tagline || '';
                const location = json.location || '';

                let html = '<nav class="navbar" id="navbar"><div class="nav-inner"><a href="/" class="nav-brand"><img src="/icon.svg" alt="MyShop"><span>MyShop</span></a><div class="nav-links">' + navLinks + '<a href="/app.html" class="nav-cta">Get Your Hub</a></div><button class="nav-toggle" onclick="toggleMenu()" aria-label="Menu"><i class="fa-solid fa-bars"></i></button></div></nav>';

                html += '<header class="hero"><img src="' + logoUrl + '" alt="' + businessName + '" class="hero-logo fade-in" onerror="this.src=\'/icon.svg\'"><h1 class="hero-name fade-in">' + businessName + '</h1>';
                if (tagline) html += '<p class="hero-tagline fade-in">' + tagline + '</p>';
                html += '<div class="hero-meta fade-in">';
                if (location) html += '<span><i class="fa-solid fa-location-dot"></i> ' + location + '</span>';
                html += '<span><span class="pulse-dot"></span> ' + (previewMode ? 'Pending Activation' : 'Active Store') + '</span>';
                html += '</div></header>';

                // Quick action buttons
                html += '<div class="quick-actions fade-in">';
                if (slug === 'demo') {
                    html += '<a href="#catalog" class="action-btn primary"><i class="fa-solid fa-bag-shopping"></i> Browse Catalog</a>';
                } else if (catalogType === 'whatsapp') {
                    html += '<a href="' + fixUrl(catalogUrl) + '" target="_blank" rel="noopener noreferrer" class="action-btn whatsapp"><i class="fa-brands fa-whatsapp"></i> View Catalog</a>';
                } else if (catalogType === 'selar' || catalogType === 'shopify' || catalogType === 'web') {
                    html += '<a href="' + fixUrl(catalogUrl) + '" target="_blank" rel="noopener noreferrer" class="action-btn primary"><i class="fa-solid fa-store"></i> Open Catalog</a>';
                } else if (waNum) {
                    html += '<a href="' + waLink + '" target="_blank" rel="noopener noreferrer" class="action-btn whatsapp"><i class="fa-brands fa-whatsapp"></i> Chat on WhatsApp</a>';
                }
                if (waNum && (catalogType === 'whatsapp' || catalogType === 'selar' || catalogType === 'shopify' || catalogType === 'web')) {
                    html += '<a href="' + waLink + '" target="_blank" rel="noopener noreferrer" class="action-btn ghost"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>';
                }
                html += '</div>';

                html += sections;

                // FAB for mobile
                if (waNum) {
                    html += '<a href="' + waLink + '" target="_blank" rel="noopener noreferrer" class="fab" title="Chat on WhatsApp" aria-label="Chat on WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>';
                }

                html += '<footer class="site-footer"><p>Powered by <a href="/">MyShop</a> — EML Tech Studio</p><div class="watermark"><img src="/icon.svg" alt="MyShop"><span>Get your own hub at <strong>myshop.afric.site</strong></span></div></footer>';

                appEl.innerHTML = html;

                // Navbar scroll effect
                window.addEventListener('scroll', function() {
                    const nav = document.getElementById('navbar');
                    if (nav) {
                        if (window.scrollY > 20) nav.classList.add('scrolled');
                        else nav.classList.remove('scrolled');
                    }
                });

                // Intersection Observer for scroll animations
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                        }
                    });
                }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

                document.querySelectorAll('.fade-in').forEach(el => {
                    observer.observe(el);
                });

                // Trigger initial visible ones
                setTimeout(() => {
                    document.querySelectorAll('.fade-in').forEach(el => {
                        const rect = el.getBoundingClientRect();
                        if (rect.top < window.innerHeight) {
                            el.classList.add('visible');
                        }
                    });
                }, 100);
            }

            window.toggleMenu = function() {
                const links = document.querySelector('.nav-links');
                if (!links) return;
                const showing = links.style.display === 'flex';
                if (showing) {
                    links.style.display = 'none';
                    links.style.position = '';
                    links.style.top = '';
                    links.style.left = '';
                    links.style.right = '';
                    links.style.flexDirection = '';
                    links.style.background = '';
                    links.style.padding = '';
                    links.style.boxShadow = '';
                    links.style.gap = '';
                    links.style.borderBottom = '';
                    links.style.zIndex = '';
                } else {
                    links.style.display = 'flex';
                    links.style.position = 'absolute';
                    links.style.top = '60px';
                    links.style.left = '0';
                    links.style.right = '0';
                    links.style.flexDirection = 'column';
                    links.style.background = 'white';
                    links.style.padding = '20px 24px';
                    links.style.boxShadow = '0 12px 32px rgba(0,0,0,0.12)';
                    links.style.gap = '16px';
                    links.style.borderBottom = '1px solid var(--border)';
                    links.style.zIndex = '999';
                }
            };
        })();
    </script>
</body>
    </html>
