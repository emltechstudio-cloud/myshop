<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1e40af">
    <title>MyShop Hub</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-secondary: #475569;
            --border: #e2e8f0;
            --radius: 20px;
            --brand-primary: #1e40af;
            --brand-secondary: #ffffff;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }
        .hub {
            max-width: 700px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            padding: 40px 32px;
            border: 1px solid var(--border);
        }
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            object-fit: cover;
            margin-bottom: 16px;
            border: 2px solid var(--border);
            background: #f1f5f9;
            display: inline-block;
        }
        .business-name {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--brand-primary);
            margin-bottom: 4px;
        }
        .tagline {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 500;
        }
        .description {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 16px;
            margin: 24px 0;
            color: var(--text);
            font-size: 1rem;
            line-height: 1.7;
        }
        .contact-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 24px 0;
        }
        .contact-btn {
            flex: 1;
            min-width: 140px;
            padding: 14px 18px;
            border-radius: 50px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            background: var(--brand-primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 1rem;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }
        .contact-btn.secondary {
            background: white;
            color: var(--brand-primary);
            border: 2px solid var(--brand-primary);
        }
        .contact-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .catalog-section {
            margin: 32px 0 20px;
        }
        .catalog-section h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text);
        }
        .catalog-frame {
            width: 100%;
            height: 500px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: white;
        }
        .social-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px;
            margin: 24px 0 0;
        }
        .social-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #f1f5f9;
            color: var(--brand-primary);
            font-size: 1.2rem;
            text-decoration: none;
            transition: all 0.2s;
        }
        .social-icon:hover {
            background: var(--brand-primary);
            color: white;
            transform: scale(1.1);
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .footer a {
            color: var(--brand-primary);
            text-decoration: none;
            font-weight: 600;
        }
        .loading-state {
            text-align: center;
            padding: 60px 0;
            color: var(--text-secondary);
        }
        .error-state {
            text-align: center;
            padding: 40px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 100%;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--brand-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="hub-content">
        <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading your hub...</p>
        </div>
    </div>

    <script>
        (async function() {
            const API = 'https://emltechstudio-myshop-api.hf.space';

            // ===== SLUG DETECTION =====
            // Netlify rewrites /:slug to /shop.html with 200 status
            // So the browser URL stays as /mystore but shop.html loads
            // We read the ORIGINAL URL path to get the slug

            let slug = '';
            const fullPath = window.location.pathname; // e.g. "/mystore" or "/shop.html" or "/"
            const searchParams = new URLSearchParams(window.location.search);

            // Method 1: Query param ?slug=demo (highest priority)
            if (searchParams.has('slug')) {
                slug = searchParams.get('slug');
            }

            // Method 2: The actual URL path
            // If path is /shop.html, we might be a rewrite - check if there's a slug in the path before
            // If path is /mystore, that's the slug directly
            if (!slug) {
                const pathParts = fullPath.split('/').filter(Boolean);
                // pathParts[0] could be "mystore" or "shop.html"
                if (pathParts.length > 0) {
                    const firstPart = pathParts[0];
                    // If first part is shop.html, check if there's something before it (unlikely with Netlify)
                    // If first part is a slug like "mystore", use it
                    if (firstPart !== 'shop.html' && firstPart !== 'index.html' && firstPart !== 'app.html') {
                        slug = firstPart;
                    }
                }
            }

            // Method 3: Check if we're on shop.html but came from a rewrite
            // Netlify 200 rewrite preserves the original URL in the address bar
            // So if URL is myshop.afric.site/mystore, fullPath is /mystore
            // and shop.html loads. slug = "mystore"

            // DEBUG
            // console.log('Path:', fullPath, 'Slug detected:', slug);

            const hubEl = document.getElementById('hub-content');

            if (!slug) {
                hubEl.innerHTML = '<div class="error-state"><h2>No shop specified</h2><p>Please provide a shop slug in the URL like <code>/your-shop-name</code></p><p style="margin-top:16px;"><a href="/" style="color:#1e40af;font-weight:600;">Go to MyShop Home</a></p></div>';
                return;
            }

            if (slug === 'demo') {
                renderDemoShop();
                return;
            }

            try {
                const res = await fetch(`${API}/shop/live/${slug}`);
                if (!res.ok) {
                    if (res.status === 404) {
                        hubEl.innerHTML = '<div class="error-state"><h2>Shop not found</h2><p>The shop "' + slug + '" doesn\'t exist or hasn\'t been activated yet.</p><p style="margin-top:16px;"><a href="/app.html" style="color:#1e40af;font-weight:600;">Create your own hub</a> · <a href="/" style="color:#1e40af;font-weight:600;">Go Home</a></p></div>';
                        return;
                    }
                    throw new Error('Shop not available');
                }
                const shop = await res.json();
                renderShop(shop);
            } catch(e) {
                hubEl.innerHTML = '<div class="error-state"><h2>Unable to load shop</h2><p>' + e.message + '</p><p style="margin-top:16px;"><a href="/" style="color:#1e40af;font-weight:600;">Go to MyShop Home</a></p></div>';
            }

            function renderShop(shop) {
                const json = shop.shop_json || {};
                const primary = json.brand_colors?.primary || '#1e40af';
                document.documentElement.style.setProperty('--brand-primary', primary);

                let html = '<div class="hub"><div class="header">';
                if (json.logo_url) {
                    html += '<img src="' + json.logo_url + '" alt="' + (json.business_name || 'Shop') + '" class="logo">';
                }
                html += '<h1 class="business-name">' + (json.business_name || 'My Hub') + '</h1>';
                if (json.tagline) html += '<p class="tagline">' + json.tagline + '</p>';
                html += '</div>';

                if (json.description) {
                    html += '<div class="description">' + json.description + '</div>';
                }

                html += '<div class="contact-row">';
                if (json.phone) {
                    html += '<a href="tel:' + json.phone + '" class="contact-btn"><i class="fa-solid fa-phone"></i> Call</a>';
                    const waNum = json.phone.replace(/\D/g, '');
                    const waMsg = encodeURIComponent('Hi ' + (json.business_name || 'there') + ', I found your shop on MyShop and I\'m interested in your products.');
                    html += '<a href="https://wa.me/' + waNum + '?text=' + waMsg + '" target="_blank" class="contact-btn secondary"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>';
                }
                if (json.email) {
                    html += '<a href="mailto:' + json.email + '" class="contact-btn secondary"><i class="fa-solid fa-envelope"></i> Email</a>';
                }
                html += '</div>';

                if (json.catalog_url) {
                    html += '<div class="catalog-section"><h3><i class="fa-solid fa-store"></i> Browse Catalog</h3>';
                    html += '<iframe src="' + json.catalog_url + '" class="catalog-frame" title="Catalog"></iframe></div>';
                }

                const socials = json.socials || {};
                const platforms = { 
                    facebook: 'fa-brands fa-facebook', 
                    instagram: 'fa-brands fa-instagram', 
                    tiktok: 'fa-brands fa-tiktok', 
                    twitter: 'fa-brands fa-twitter' 
                };
                let socialHtml = '<div class="social-links">';
                let hasSocials = false;
                for (let [key, icon] of Object.entries(platforms)) {
                    if (socials[key]) {
                        hasSocials = true;
                        socialHtml += '<a href="' + socials[key] + '" target="_blank" class="social-icon" title="' + key + '"><i class="' + icon + '"></i></a>';
                    }
                }
                socialHtml += '</div>';
                if (hasSocials) html += socialHtml;

                html += '</div><div class="footer">Powered by <a href="/">MyShop</a> — EML Tech Studio</div>';
                hubEl.innerHTML = html;
            }

            function renderDemoShop() {
                const demo = {
                    business_name: "Sample Store",
                    tagline: "Quality products for you",
                    description: "We bring you the best products directly from our catalog. Browse, shop, and connect with us instantly.",
                    logo_url: "/icon.svg",
                    phone: "+2348000000000",
                    email: "hello@samplestore.com",
                    catalog_url: "https://selar.co",
                    brand_colors: { primary: "#1e40af" },
                    socials: { facebook: "https://facebook.com", instagram: "https://instagram.com" }
                };
                renderShop({ shop_json: demo });
            }
        })();
    </script>
</body>
</html>
